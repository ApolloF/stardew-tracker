version: '3.9'

services:
  backend:
    build: ./backend
    container_name: stardew-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data   # progress is saved here, persists across restarts
    environment:
      PORT: 3001
    networks:
      - stardew-net

  frontend:
    build: ./frontend
    container_name: stardew-frontend
    restart: unless-stopped
    ports:
      - "1423:80"   # change 8080 to whatever port you want on your host
    depends_on:
      - backend
    networks:
      - stardew-net

networks:
  stardew-net:
    driver: bridge
