server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location /api/ {
    proxy_pass http://backend:3001;
    # $http_host keeps the port; $host drops it, which breaks the backend's
    # Origin/Host same-origin check on any non-default port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
