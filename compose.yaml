services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATA_DIR: /app/data
      LEGACY_PROGRESS_FILE: /legacy/progress.json
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env before starting}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - stardew-data:/app/data
      - ./backend/data:/legacy
    networks: [stardew]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    ports: ["4105:80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [stardew]
networks:
  stardew:
volumes:
  stardew-data:
